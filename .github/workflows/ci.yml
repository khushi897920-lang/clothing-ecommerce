name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Audit and Build Frontend (Next.js)
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  # Job 2: Audit and Type-Check Backend (Express Monorepo)
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Monorepo Dependencies
        run: |
          cd backend
          npm install

      - name: Verify Service Configurations
        run: |
          cd backend
          # Verify that all service packages compile / compile check
          npx tsc --noEmit -p api-gateway/tsconfig.json
          npx tsc --noEmit -p auth-service/tsconfig.json
          npx tsc --noEmit -p user-service/tsconfig.json
          npx tsc --noEmit -p product-service/tsconfig.json
          npx tsc --noEmit -p inventory-service/tsconfig.json
          npx tsc --noEmit -p order-service/tsconfig.json
          npx tsc --noEmit -p payment-service/tsconfig.json
          npx tsc --noEmit -p notification-service/tsconfig.json
