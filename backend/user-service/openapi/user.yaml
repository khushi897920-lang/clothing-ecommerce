openapi: 3.0.3
info:
  title: YUGEN User Service API
  description: Customer profile, address book, and wishlist microservice.
  version: 1.0.0
servers:
  - url: http://localhost:8002/users
  - url: http://localhost:8000/api/v1/users
paths:
  /me:
    get:
      summary: Get current authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
    patch:
      summary: Update current authenticated user profile
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                phone: { type: string }
      responses:
        '200':
          description: Profile updated
  /me/addresses:
    get:
      summary: List customer delivery addresses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of addresses
    post:
      summary: Add new delivery address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, addressLine1, city, state, postalCode]
              properties:
                fullName: { type: string }
                phone: { type: string }
                addressLine1: { type: string }
                addressLine2: { type: string }
                city: { type: string }
                state: { type: string }
                postalCode: { type: string }
                country: { type: string }
                isDefault: { type: boolean }
      responses:
        '201':
          description: Address created
  /me/wishlist:
    get:
      summary: List customer wishlist items
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wishlist items
    post:
      summary: Add product to wishlist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        '201':
          description: Added to wishlist
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
